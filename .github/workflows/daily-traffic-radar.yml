name: Independent SEO Traffic Site Radar

on:
  workflow_dispatch:
  push:
    paths:
      - 'radar.py'
      - 'triage.py'
      - 'discovery_quality.py'
      - 'demand_gate.py'
      - 'competitor_first.py'
      - 'tests/**'
      - 'inputs/**'
      - 'data/manual-site-decisions.json'
      - '.github/workflows/daily-traffic-radar.yml'
  schedule:
    - cron: '0 0 * * *' # 08:00 Singapore/Beijing time. Actual dispatch may be delayed.

permissions:
  contents: write

concurrency:
  group: independent-traffic-radar
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and isolated unit tests
        run: |
          python -m compileall -q radar.py tests
          python -m unittest discover -s tests -v
      - name: Discover tool-site leads (bounded public GitHub Search)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python radar.py --github-live
          python triage.py
          python discovery_quality.py
          python demand_gate.py
          python competitor_first.py
      - name: Validate evidence-first output
        run: |
          python -m json.tool reports/latest.json >/dev/null
          test -s reports/latest.md
          python -m json.tool reports/triage.json >/dev/null
          test -s reports/triage.md
          python -m json.tool reports/discovery-quality.json >/dev/null
          test -s reports/discovery-quality.md
          python -m json.tool data/site-history.json >/dev/null
          python -m json.tool data/manual-site-decisions.json >/dev/null
          python -m json.tool reports/demand-gate.json >/dev/null
          test -s reports/demand-gate.md
          python -m json.tool reports/competitor-first.json >/dev/null
          test -s reports/competitor-first.md
      - name: Print evidence provenance summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("reports/latest.json").read_text(encoding="utf-8"))
          print("SERP-import candidates:", len(r["serp_candidates"]))
          print("Unverified public GitHub homepages:", len(r["github_leads"]))
          print("GitHub discovery query failures:", len(r["github_failures"]))
          t = json.loads(Path("reports/triage.json").read_text(encoding="utf-8"))
          print("Country-level final SERP review queue:", t["ready_for_final_serp_review_count"])
          assert not t["organic_traffic_verified_automatically"]
          assert t["github_leads_promoted_to_seo_evidence"] == 0
          d = json.loads(Path("reports/discovery-quality.json").read_text(encoding="utf-8"))
          print("GH technical leads to inspect (NOT SEO evidence):", len(d["priority_to_inspect"]))
          assert d["no_semrush_requests_from_github_alone"]
          assert not d["organic_traffic_verified_automatically"]
          g = json.loads(Path("reports/demand-gate.json").read_text(encoding="utf-8"))
          print("Exact core tool keywords needing Volume/KD:", sum(x["stage"] == "NEEDS_EXACT_CORE_VOLUME" for x in g["candidates"]))
          assert not g["any_organic_traffic_verified_automatically"]
          comp = json.loads(Path("reports/competitor-first.json").read_text(encoding="utf-8"))
          print("Public organic competitor SERP review candidates:", len(comp["shortlist_for_serp_check"]))
          assert comp["organic_traffic_numbers_are_public_provider_estimates_not_first_party"]
          assert r["seo_provider_metrics_verified_automatically"] is False
          PY
      - name: Upload independent JSON and Markdown reports
        uses: actions/upload-artifact@v4
        with:
          name: traffic-site-radar-${{ github.run_id }}
          path: |
            reports/latest.json
            reports/latest.md
            reports/triage.json
            reports/triage.md
            reports/discovery-quality.json
            reports/discovery-quality.md
            reports/demand-gate.json
            reports/demand-gate.md
            reports/competitor-first.json
            reports/competitor-first.md
          retention-days: 14
      - name: Commit only this radar's reports
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/latest.md reports/triage.json reports/triage.md reports/discovery-quality.json reports/discovery-quality.md reports/demand-gate.json reports/demand-gate.md reports/competitor-first.json reports/competitor-first.md data/site-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh traffic-site research snapshots [skip ci]'
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "::notice::Main advanced; skip stale report push"
              exit 0
            fi
            if ! git push origin HEAD:main; then
              git fetch origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                echo "::notice::Another commit landed; skip stale report push"
                exit 0
              fi
              echo "::error::Report update push failed"
              exit 1
            fi
          fi
